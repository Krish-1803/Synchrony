server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: synchrony-inclusion
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/synchrony}
    username: ${DB_USERNAME:synchrony}
    password: ${DB_PASSWORD:synchrony}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

synchrony:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Provide JWT_SECRET as an environment variable. Minimum 32 bytes. The
      # service fails fast on startup when it is missing, by design.
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  scoring:
    gamma: ${SCORING_GAMMA:8.0}
    intercept: ${SCORING_INTERCEPT:0.0}
    approve-threshold: ${SCORING_APPROVE_THRESHOLD:640}
    decline-threshold: ${SCORING_DECLINE_THRESHOLD:580}
    model-version: ${MODEL_VERSION:hybrid-gnn-alt-1.0.0}
  bedrock:
    enabled: ${BEDROCK_ENABLED:false}
    region: ${AWS_REGION:us-east-1}
    model-id: ${BEDROCK_MODEL_ID:anthropic.claude-3-5-sonnet-20240620-v1:0}
    max-tokens: ${BEDROCK_MAX_TOKENS:900}
    temperature: ${BEDROCK_TEMPERATURE:0.2}
  seed:
    enabled: ${SEED_ENABLED:true}
    officer-username: ${SEED_OFFICER_USERNAME:officer}
    officer-password: ${SEED_OFFICER_PASSWORD:Officer#2024}
    applicant-password: ${SEED_APPLICANT_PASSWORD:Applicant#2024}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.synchrony.inclusion: INFO
