# Synchrony Dynamic Risk Assessment - local orchestration.
#
# Quick start:
#   1. Copy .env.example to .env and set JWT_SECRET (32 bytes or more).
#   2a. Database only (run backend and frontend locally):  docker compose up -d db
#   2b. Full stack in containers:                          docker compose up --build
#
# The database image ships with pgvector. The schema is applied on first start
# from backend/src/main/resources/db/schema.sql.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-synchrony}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-synchrony}
      POSTGRES_DB: ${DB_NAME:-synchrony}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql is the canonical reference migration. It is not mounted into
      # init, because the backend owns schema creation: Hibernate builds the
      # relational tables and the vector service creates the pgvector extension,
      # the feature_embedding table and its HNSW index. Mounting it here as well
      # would double-manage the schema and cause Hibernate ALTER churn.
    healthcheck:
      # Check over TCP (-h 127.0.0.1), not the Unix socket. During the init-script
      # phase Postgres listens on the socket only, so a socket check reports ready
      # too early and the backend races the database. A TCP check is accurate.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME:-synchrony} -d ${DB_NAME:-synchrony}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-synchrony}
      DB_USERNAME: ${DB_USERNAME:-synchrony}
      DB_PASSWORD: ${DB_PASSWORD:-synchrony}
      # A demo default so the stack runs with no setup. Override in .env for production.
      JWT_SECRET: ${JWT_SECRET:-synchrony-local-demo-secret-key-change-in-production-0123456789}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      # Faster JVM cold start.
      JAVA_OPTS: "-XX:TieredStopAtLevel=1 -XX:+UseParallelGC"
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-5-sonnet-20240620-v1:0}
      SEED_OFFICER_PASSWORD: ${SEED_OFFICER_PASSWORD:-Officer#2024}
      SEED_APPLICANT_PASSWORD: ${SEED_APPLICANT_PASSWORD:-Applicant#2024}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
